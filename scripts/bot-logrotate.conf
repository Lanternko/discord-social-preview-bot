# Log rotation for bot.log — the log carries user/guild ids and the odd
# content fragment, so it gets a time limit like the rest of the stored data
# (the privacy policy states 14 days; change both together).
#
# Runs as the bot's own user from cron, no root needed (see docs/deploy.md):
#   17 4 * * * /usr/sbin/logrotate -s $HOME/.local/state/dspb-logrotate.status \
#     $HOME/side_projects/apps/discord-social-preview-bot/scripts/bot-logrotate.conf
#
# copytruncate: the bot holds bot.log open in append mode (watchdog `>>`), so
# the file is copied and emptied in place — no restart, no signal handling.
# No dateext: `bot.log.1`, `bot.log.2.gz` match the `bot.log.*` gitignore rule.
/home/kojiek/side_projects/apps/discord-social-preview-bot/bot.log {
    daily
    rotate 14
    maxage 14
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}
